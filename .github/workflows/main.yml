# GitHub Pages automatikus telepítő munkafolyamat (Workflow)
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Beállíthatod arra az ágra, amit használsz (pl. master vagy main)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kód letöltése
        uses: actions/checkout@v4

      - name: Node.js környezet beállítása
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Függőségek letöltése
        run: npm ci

      - name: Statikus oldal buildelése (dist mappa elkészítése)
        run: npm run build

      - name: Pages beállítása
        uses: actions/configure-pages@v4

      - name: Buildelt fájlok feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Telepítés GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
